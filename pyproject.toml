[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-assistant"
version = "0.9.0"
description = "Production-ready AI Assistant"
requires-python = ">=3.11"

dependencies = [
    "fastapi[standard]",
    "uvicorn"
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]